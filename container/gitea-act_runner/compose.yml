# -*- mode: yaml; -*-
secrets:
  atelier_sciences_runner_token:
    external: true

services:
  runner:
    image: gitea/act_runner
    network_mode: 'host'
    restart: always
    volumes:
      - ./data:/data
      - /var/run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
    environment:
      - GITEA_INSTANCE_URL=https://kheb.ignorelist.com:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN_FILE=/run/secrets/atelier_sciences_runner_token
      - CONFIG_FILE=config.yml
    secrets:
      - atelier_sciences_runner_token
